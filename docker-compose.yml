name: avanceos

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: avanceos-backend:latest
    env_file:
      - ./.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001

      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ENCRYPT: ${DB_ENCRYPT}
      DB_TRUST_SERVER_CERTIFICATE: ${DB_TRUST_SERVER_CERTIFICATE}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}

      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-1000}
      THROTTLE_SENSITIVE_LIMIT: ${THROTTLE_SENSITIVE_LIMIT:-100}
      LOGIN_THROTTLE_LIMIT: ${LOGIN_THROTTLE_LIMIT:-30}
      LOGIN_THROTTLE_TTL: ${LOGIN_THROTTLE_TTL:-60000}

      OFYCIA_PROVIDER: ${OFYCIA_PROVIDER:-local}
      OFYCIA_LABTECH_DIR: /app/techhub-imports/Entrada

      OFYCIA_AI_ENABLED: ${OFYCIA_AI_ENABLED:-false}
      OFYCIA_AI_PROVIDER: ${OFYCIA_AI_PROVIDER:-fallback-local}

      AZURE_FOUNDRY_PROJECT_ENDPOINT: ${AZURE_FOUNDRY_PROJECT_ENDPOINT}
      AZURE_FOUNDRY_ENDPOINT: ${AZURE_FOUNDRY_ENDPOINT}
      AZURE_FOUNDRY_API_KEY: ${AZURE_FOUNDRY_API_KEY}
      AZURE_FOUNDRY_DEPLOYMENT: ${AZURE_FOUNDRY_DEPLOYMENT}
      AZURE_FOUNDRY_API_VERSION: ${AZURE_FOUNDRY_API_VERSION}

      AZURE_OPENAI_ENABLED: ${AZURE_OPENAI_ENABLED:-false}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION}
      AZURE_OPENAI_MAX_TOKENS: ${AZURE_OPENAI_MAX_TOKENS:-1200}

    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - backend_uploads:/app/uploads
      - /mnt/avanceos/techhub-imports:/app/techhub-imports:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: avanceos-frontend:latest
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: avanceos_sqlserver
    profiles:
      - lab-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  backend_uploads:
  mssql_data:
